name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # the /api rewrite is compiled in, so the build needs an API origin; no API has to be running
      - run: npx next build
        env:
          API_ORIGIN: http://localhost:5000
